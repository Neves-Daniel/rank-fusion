[pytest]
# Permite `from src.data import ...` rodando pytest da raiz do projeto.
pythonpath = .
testpaths = tests
addopts = -q
markers =
    bm25: usa o retriv/BM25 real (mais lento; pulado se retriv não estiver instalado)
    vllm: usa o vLLM real (requer GPU; pulado se vllm não estiver instalado)
    bert: usa o BERT/transformers real (mais lento; pulado se transformers/pml não estiverem instalados)
